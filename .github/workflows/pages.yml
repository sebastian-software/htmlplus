name: Verify and deploy demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # A newer pull request commit supersedes a run, but a deployment must not stop halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Keep this version aligned with Playwright in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare Firefox container home
        # GitHub mounts this directory with runner ownership; Firefox checks its owner.
        run: chown "$(id -u):$(id -g)" "$HOME"
      - run: npm test
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  minimum-node:
    # package.json promises Node.js 22; browsers are covered by the verify job.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  deploy:
    if: github.event_name != 'pull_request'
    needs: [verify, minimum-node]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
